name: Marketplace package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: vscode-marketplace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-language-server:
    name: Build LSP (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            executable: wave-agape
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64
            executable: wave-agape.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x64
            executable: wave-agape
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
            executable: wave-agape
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out wave-agape
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.WAVE_AGAPE_REPOSITORY || 'wavefnd/wave-agape' }}
          ref: ${{ vars.WAVE_AGAPE_REF || 'v0.2.0' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage executable
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/${{ matrix.executable }}"
      - uses: actions/upload-artifact@v4
        with:
          name: wave-agape-${{ matrix.platform }}
          path: dist/${{ matrix.executable }}
          if-no-files-found: error

  package:
    needs: build-language-server
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: wave-agape-linux-x64
          path: server/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: wave-agape-win32-x64
          path: server/win32-x64
      - uses: actions/download-artifact@v4
        with:
          name: wave-agape-darwin-x64
          path: server/darwin-x64
      - uses: actions/download-artifact@v4
        with:
          name: wave-agape-darwin-arm64
          path: server/darwin-arm64
      - name: Prepare bundled servers
        run: chmod +x server/linux-x64/wave-agape server/darwin-x64/wave-agape server/darwin-arm64/wave-agape
      - name: Verify tag and extension version
        if: github.event_name == 'push'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected"
      - name: Build VSIX
        run: npx --yes @vscode/vsce@3.9.2 package --out "wave-$(node -p "require('./package.json').version").vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: wave-vscode-marketplace
          path: "*.vsix"
          if-no-files-found: error
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@3.9.2 publish --packagePath "wave-$(node -p "require('./package.json').version").vsix" --pat "$VSCE_PAT"
